<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#e8c37a;--gold-deep:#c79a4b;--gold-soft:#f6e2b0;--ink:#f3ecde;
  --sans:-apple-system,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo",Segoe UI,Roboto,sans-serif;
  --disp:"Cinzel","Songti SC","Hiragino Mincho ProN","Apple SD Gothic Neo",serif}
html,body{background:#000}
.creative{position:relative;width:1200px;height:628px;overflow:hidden;font-family:var(--disp);color:var(--ink)}
.bg{position:absolute;inset:0;background:url('./assets/bg/battle_zues.jpg') 68% 16%/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(8,7,12,.98) 0%, rgba(9,8,14,.9) 34%, rgba(10,9,16,.35) 60%, rgba(10,9,16,.1) 100%)}
.frame{position:absolute;inset:18px;border:2px solid rgba(232,195,122,.4);border-radius:22px;pointer-events:none}
.wrap{position:absolute;inset:0;padding:44px 52px;display:flex;flex-direction:column;width:66%}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:13px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.brand .bt{font-weight:800;font-size:25px;letter-spacing:.05em}.brand .bt b{color:var(--gold)}
.eyebrow{margin-top:16px;align-self:flex-start;display:inline-flex;align-items:center;font-family:var(--sans);
  font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--gold);border:1px solid rgba(232,195,122,.5);
  border-radius:999px;padding:8px 18px;background:rgba(232,195,122,.08);text-transform:uppercase}
h1{font-weight:900;font-size:66px;line-height:.96;margin-top:14px;text-shadow:0 5px 30px rgba(0,0,0,.7)}
h1 .g{background:linear-gradient(180deg,#fff 6%,var(--gold-soft) 52%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-family:var(--sans);font-weight:500;font-size:21px;color:#e6dff0;margin-top:14px;max-width:28ch;line-height:1.35;
  text-shadow:0 2px 10px rgba(0,0,0,.85)}
.row{margin-top:auto;display:flex;align-items:center;gap:22px}
.btn{font-family:var(--sans);font-weight:800;font-size:25px;letter-spacing:.03em;color:#1a1408;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold-deep));padding:18px 36px;border-radius:14px;
  box-shadow:0 8px 24px rgba(199,154,75,.5);text-transform:uppercase;white-space:nowrap}
.rw{display:flex;align-items:center;gap:10px}
.rw .chip{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 26%,rgba(232,195,122,.2),rgba(255,255,255,.04));border:1px solid rgba(232,195,122,.5)}
.rw .chip img{width:38px;height:38px;object-fit:contain}
.count{margin-top:16px;font-family:var(--sans);font-size:17px;color:#cfc7db}
.count b{color:var(--gold-soft)}
.url{margin-top:6px;font-family:var(--sans);font-size:16px;color:#a79fbb;letter-spacing:.02em}
</style></head>
<body>
<div class="creative">
  <div class="bg"></div><div class="frame"></div>
  <div class="wrap">
    <div class="brand"><img src="./icon.png" alt=""><div class="bt">BEYOND<b>GOD</b></div></div>
    <span class="eyebrow" id="eyebrow"></span>
    <h1><span class="g">BEYOND GOD</span><br><span class="g">ASCENSION</span></h1>
    <p class="tag" id="tag"></p>
    <div class="row">
      <div class="btn" id="cta"></div>
      <div>
        <div class="rw">
          <div class="chip"><img src="./assets/items/gems.png"></div>
          <div class="chip"><img src="./assets/items/divine.png"></div>
          <div class="chip"><img src="./assets/items/sigil.png"></div>
          <div class="chip"><img src="./assets/items/realm.png"></div>
        </div>
        <div class="count"><b id="cnt"></b> <span id="cntsuf"></span></div>
        <div class="url" id="url"></div>
      </div>
    </div>
  </div>
</div>
<script>
const L={
 "en":{eyebrow:"Collect · Battle · Ascend",tag:"Summon the gods of four mythologies and rise from mortal to myth.",cta:"Pre-register",cnt:"43,000+",cntsuf:"summoners already in · free launch rewards",url:"beyondgod.bubluestudio.com"},
 "zh-TW":{eyebrow:"收集 · 戰鬥 · 飛昇",tag:"召喚四大神話的諸神，從凡人蛻變為傳說。",cta:"立即預約",cnt:"43,000+",cntsuf:"位召喚師已預約 · 免費開服獎勵",url:"beyondgod.bubluestudio.com"},
 "ja":{eyebrow:"集める · 戦う · 昇華",tag:"四大神話の神々を召喚し、人の身から神話へと昇りつめよ。",cta:"事前登録受付中",cnt:"43,000+",cntsuf:"人が事前登録済み · 無料リリース報酬",url:"beyondgod.bubluestudio.com"},
 "ko":{eyebrow:"수집 · 전투 · 승천",tag:"네 신화의 신들을 소환하고, 필멸자에서 신화로 거듭나세요.",cta:"사전예약",cnt:"43,000+",cntsuf:"명 사전예약 · 무료 출시 보상",url:"beyondgod.bubluestudio.com"}
};
const lang=new URLSearchParams(location.search).get("lang")||"en";
document.documentElement.lang=lang;const d=L[lang]||L.en;
for(const k in d){const e=document.getElementById(k);if(e)e.textContent=d[k];}
</script>
</body></html>
